# values-production.yaml - Configurações para ambiente de produção
# Este arquivo sobrescreve valores do values.yaml para o ambiente de produção

# Configurações da aplicação para produção
app:
  environment: production

# Configurações de réplicas para produção (alta disponibilidade)
replicaCount: 3

# Configurações do Ingress para produção
ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: gitops-demo.production.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gitops-demo-tls
      hosts:
        - gitops-demo.production.com

# Recursos para produção (máximo desempenho)
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Variáveis de ambiente para produção
env:
  - name: ENVIRONMENT
    value: "production"
  - name: APP_VERSION
    value: "1.0.0"
  - name: PORT
    value: "5000"
  - name: DEBUG
    value: "false"

# Health checks otimizados para produção
healthCheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 2
  readinessProbe:
    httpGet:
      path: /ready
      port: 5000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

# Affinity para distribuir pods em nós diferentes (alta disponibilidade)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - gitops-demo-api
        topologyKey: kubernetes.io/hostname