apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FlavioJunior94/Plataforma_Kubernetes_com_GitOps-ArgoCD.git
    targetRevision: HEAD
    path: helm-charts/myapp
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
