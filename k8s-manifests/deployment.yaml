apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo-api
  labels:
    app: gitops-demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-demo-api
  template:
    metadata:
      labels:
        app: gitops-demo-api
    spec:
      containers:
      - name: api
        image: gitops-demo-api:1.0.0
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: ENVIRONMENT
          value: "argocd-managed"